# Meridian — production (Pi). See docs/spec/meridian-project-scaffold.md §3.
#
# Only `cloudflared` is exposed to the internet. Everything else is internal
# or loopback-only. Application images (worker/orchestrator/api/web) are not
# built yet — this file documents the target topology; `docker compose up`
# will fail until services/*/Dockerfile exist (scaffold §8, phase 1+).

name: meridian

x-common: &common
  restart: unless-stopped
  env_file: .env
  networks: [internal]
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

services:
  postgres:
    <<: *common
    image: pgvector/pgvector:pg17          # TODO: pin by digest before production
    volumes:
      - ${DATA_ROOT:-/srv/meridian}/pgdata:/var/lib/postgresql/data
      - ./scripts/init-roles.sh:/docker-entrypoint-initdb.d/10-roles.sh:ro
    environment:
      POSTGRES_DB: meridian
      POSTGRES_USER: ${PG_USER}
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      PG_RW_PASSWORD: ${PG_RW_PASSWORD}
      PG_RO_PASSWORD: ${PG_RO_PASSWORD}
    command: >
      postgres
      -c shared_buffers=2GB
      -c work_mem=32MB
      -c max_connections=40
      -c synchronous_commit=on
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER} -d meridian"]
      interval: 10s
      retries: 5

  searxng:
    <<: *common
    image: searxng/searxng:latest          # TODO: pin
    volumes:
      - ./config/searxng:/etc/searxng:ro
    environment:
      SEARXNG_BASE_URL: http://searxng:8080/

  crawl4ai:
    <<: *common
    image: unclecode/crawl4ai:0.9.2        # PIN — see spec §6.4 security note
    shm_size: 1g
    environment:
      CRAWL4AI_API_TOKEN: ${CRAWL4AI_TOKEN}
      CRAWL4AI_HOOKS_ENABLED: "false"
    # NO ports: — internal network only, never exposed

  worker:
    <<: *common
    build: { context: ., dockerfile: services/worker/Dockerfile }
    depends_on:
      postgres: { condition: service_healthy }
    volumes:
      - ${DATA_ROOT:-/srv/meridian}/raw:/data/raw
      - ${DATA_ROOT:-/srv/meridian}/figures:/data/figures
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    deploy:
      resources:
        limits: { memory: 4G }

  orchestrator:
    <<: *common
    build: { context: ., dockerfile: services/orchestrator/Dockerfile }
    depends_on:
      postgres: { condition: service_healthy }
    volumes:
      - ${DATA_ROOT:-/srv/meridian}/raw:/data/raw:ro
    network_mode: bridge          # needs LAN access to llama.cpp + WoL
    networks: [internal, lan]
    cap_add: [NET_RAW]            # wake-on-LAN magic packets

  api:
    <<: *common
    build: { context: ., dockerfile: services/api/Dockerfile }
    depends_on:
      postgres: { condition: service_healthy }
    volumes:
      - ${DATA_ROOT:-/srv/meridian}/raw:/data/raw:ro
      - ${DATA_ROOT:-/srv/meridian}/figures:/data/figures:ro
    ports: ["127.0.0.1:8000:8000"]   # loopback only; cloudflared fronts it

  web:
    <<: *common
    build: { context: ./web }
    depends_on: [api]

  cloudflared:
    <<: *common
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}

networks:
  internal:
    driver: bridge
    internal: true          # blocks outbound internet; worker needs a second,
                             # non-internal network for fetching — wire this up
                             # when services/worker is implemented (scaffold §3)
  lan:
    driver: bridge
