  <div style="height: 1px; background: #202B45;"></div>

  <div style="display: flex; flex-direction: column; gap: 16px;">

        <span style="font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-size: 10.5px; color: #9BA8C4;">queue 412 · ok</span>
      </div>
    </div>

</div>
