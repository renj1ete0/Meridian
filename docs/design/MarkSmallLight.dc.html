<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@300;400;500;600;700&family=IBM+Plex+Mono:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap">
  <style>
    body { margin: 0; font-family: 'Archivo', 'Helvetica Neue', Arial, sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: #0D6F7C; } a:hover { color: #0A5761; }
    .cap { font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-size: 9px; letter-spacing: 0.13em; text-transform: uppercase; color: #5C6A85; }
  </style>
</helmet>
<div style="width: 560px; height: 520px; overflow: hidden; background: #F1F3F7; box-sizing: border-box; padding: 40px; display: flex; flex-direction: column; gap: 26px;">

  <div style="display: flex; justify-content: space-between; align-items: baseline;">
    <div class="cap">Mark at size · light</div>
    <div class="cap">05</div>
  </div>

  <div style="display: flex; align-items: flex-end; gap: 30px;">
    <div style="display: flex; flex-direction: column; align-items: center; gap: 12px;">
      <svg viewBox="0 0 100 100" width="48" height="48" fill="none" style="display: block;">
        <circle cx="50" cy="50" r="38" stroke="#101A2E" stroke-width="2.4"></circle>
        <ellipse cx="50" cy="50" rx="14" ry="38" stroke="#101A2E" stroke-width="2.8"></ellipse>
        <path d="M50 50 L81.1 71.8" stroke="#101A2E" stroke-width="2.4" stroke-linecap="round"></path>
        <circle cx="81.1" cy="71.8" r="4" fill="#101A2E"></circle>
        <circle cx="50" cy="88" r="4.2" fill="#101A2E"></circle>
        <circle cx="50" cy="50" r="5" fill="#101A2E"></circle>
        <circle cx="50" cy="12" r="6" fill="#0D6F7C"></circle>
      </svg>
      <div class="cap">48</div>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 12px;">
      <svg viewBox="0 0 100 100" width="32" height="32" fill="none" style="display: block;">
        <circle cx="50" cy="50" r="38" stroke="#101A2E" stroke-width="2.4"></circle>
        <ellipse cx="50" cy="50" rx="14" ry="38" stroke="#101A2E" stroke-width="2.8"></ellipse>
        <path d="M50 50 L81.1 71.8" stroke="#101A2E" stroke-width="2.4" stroke-linecap="round"></path>
        <circle cx="81.1" cy="71.8" r="4" fill="#101A2E"></circle>
        <circle cx="50" cy="88" r="4.2" fill="#101A2E"></circle>
        <circle cx="50" cy="50" r="5" fill="#101A2E"></circle>
        <circle cx="50" cy="12" r="6" fill="#0D6F7C"></circle>
      </svg>
      <div class="cap">32</div>
    </div>
    <div style="width: 1px; height: 44px; background: #DBE0EA;"></div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 12px;">
      <svg viewBox="0 0 100 100" width="24" height="24" fill="none" style="display: block;">
        <circle cx="50" cy="50" r="38" stroke="#101A2E" stroke-width="3.6"></circle>
        <ellipse cx="50" cy="50" rx="17" ry="38" stroke="#101A2E" stroke-width="3.6"></ellipse>
        <circle cx="50" cy="88" r="5" fill="#101A2E"></circle>
        <circle cx="50" cy="50" r="6" fill="#101A2E"></circle>
        <circle cx="50" cy="12" r="7" fill="#0D6F7C"></circle>
      </svg>
      <div class="cap">24</div>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 12px;">
      <svg viewBox="0 0 100 100" width="20" height="20" fill="none" style="display: block;">
        <circle cx="50" cy="50" r="38" stroke="#101A2E" stroke-width="3.6"></circle>
        <ellipse cx="50" cy="50" rx="17" ry="38" stroke="#101A2E" stroke-width="3.6"></ellipse>
        <circle cx="50" cy="88" r="5" fill="#101A2E"></circle>
        <circle cx="50" cy="50" r="6" fill="#101A2E"></circle>
        <circle cx="50" cy="12" r="7" fill="#0D6F7C"></circle>
      </svg>
      <div class="cap">20</div>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 12px;">
      <svg viewBox="0 0 100 100" width="16" height="16" fill="none" style="display: block;">
        <circle cx="50" cy="50" r="38" stroke="#101A2E" stroke-width="3.6"></circle>
        <ellipse cx="50" cy="50" rx="17" ry="38" stroke="#101A2E" stroke-width="3.6"></ellipse>
        <circle cx="50" cy="88" r="5" fill="#101A2E"></circle>
        <circle cx="50" cy="50" r="6" fill="#101A2E"></circle>
        <circle cx="50" cy="12" r="7" fill="#0D6F7C"></circle>
      </svg>
      <div class="cap">16</div>
    </div>
  </div>

  <div style="height: 1px; background: #DBE0EA;"></div>

  <div style="display: flex; gap: 24px; align-items: flex-start;">
    <div style="display: flex; flex-direction: column; gap: 12px;">
      <div class="cap">Grayscale, 16px</div>
      <div style="display: flex; gap: 14px; align-items: flex-end;">
        <svg viewBox="0 0 100 100" width="64" height="64" fill="none" style="display: block;">
          <circle cx="50" cy="50" r="38" stroke="#3D3D3D" stroke-width="3.6"></circle>
          <ellipse cx="50" cy="50" rx="17" ry="38" stroke="#3D3D3D" stroke-width="3.6"></ellipse>
          <circle cx="50" cy="88" r="5" fill="#3D3D3D"></circle>
          <circle cx="50" cy="50" r="6" fill="#3D3D3D"></circle>
          <circle cx="50" cy="12" r="7" fill="#3D3D3D"></circle>
        </svg>
      </div>
    </div>
    <div style="font-size: 12.5px; line-height: 1.62; color: #4E5A73; text-wrap: pretty; padding-top: 22px;">On paper the mark prints as one ink at <span style="font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; color: #101A2E;">100%&nbsp;K</span>. No hairlines: at 16px the 3.6 stroke resolves to roughly 0.58px, which is the reason the compact form exists.</div>
  </div>

  <div style="height: 1px; background: #DBE0EA;"></div>

  <div style="display: flex; flex-direction: column; gap: 16px;">
    <div class="cap">In place, true size</div>
    <div style="display: flex; gap: 22px; align-items: center;">
      <div style="display: flex; align-items: center; gap: 8px; background: #FFFFFF; border: 1px solid #DBE0EA; border-radius: 6px 6px 0 0; padding: 8px 14px 9px; border-bottom: none;">
        <svg viewBox="0 0 100 100" width="16" height="16" fill="none" style="display: block; flex-shrink: 0;">
          <circle cx="50" cy="50" r="38" stroke="#101A2E" stroke-width="3.6"></circle>
          <ellipse cx="50" cy="50" rx="17" ry="38" stroke="#101A2E" stroke-width="3.6"></ellipse>
          <circle cx="50" cy="88" r="5" fill="#101A2E"></circle>
          <circle cx="50" cy="50" r="6" fill="#101A2E"></circle>
          <circle cx="50" cy="12" r="7" fill="#0D6F7C"></circle>
        </svg>
        <span style="font-size: 12px; color: #33405A; white-space: nowrap;">Meridian &mdash; Admin</span>
      </div>
      <div style="display: flex; align-items: center; gap: 10px; padding: 9px 0; border-top: 2px solid #101A2E; min-width: 168px;">
        <svg viewBox="0 0 100 100" width="18" height="18" fill="none" style="display: block; flex-shrink: 0;">
          <circle cx="50" cy="50" r="38" stroke="#101A2E" stroke-width="3.6"></circle>
          <ellipse cx="50" cy="50" rx="17" ry="38" stroke="#101A2E" stroke-width="3.6"></ellipse>
          <circle cx="50" cy="88" r="5" fill="#101A2E"></circle>
          <circle cx="50" cy="50" r="6" fill="#101A2E"></circle>
          <circle cx="50" cy="12" r="7" fill="#101A2E"></circle>
        </svg>
        <span style="font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-size: 9px; letter-spacing: 0.15em; text-transform: uppercase; color: #5C6A85;">Coverage report · p.&thinsp;7</span>
      </div>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
