[project]
name = "meridian-core"
version = "0.102.0"
description = "Shared models, schemas, and database access for Meridian services"
requires-python = ">=3.12"
license = "MIT"
license-files = ["../../LICENSE"]
dependencies = [
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "pgvector>=0.3.6",
    "pydantic>=2.10",
    # `policy.file_defaults()` reads config/fetch_policy.yaml as the floor under
    # every fetch policy (§13.1). Declared here rather than on the root project:
    # a service installed with `--package meridian-worker` gets meridian_core and
    # nothing the root happens to also depend on, which is exactly how the
    # container found this missing and dev never did.
    "pyyaml>=6.0",
    # `embedder.py` imports it at module level, and both the API and the worker
    # import `embedder`. An earlier comment here argued an HTTP client had no
    # business in this closure and put `httpx` on `meridian-worker` instead —
    # which was right until `P2-17` put the sidecar *client* in this package.
    # The rule the comment was protecting still holds: a package declares what
    # it imports, and this one imports httpx.
    "httpx>=0.28",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.optional-dependencies]
# The model client (`P4-15`). An extra rather than a dependency, because
# `meridian-worker` says of itself "never calls an LLM (§2.1, §6.1)" and that
# is an invariant rather than a habit — the fast loop has to keep acquiring
# while an agent is unavailable, which is only true if it cannot depend on one.
# The worker image is built with `--package meridian-worker` and does not ask
# for this extra, so it physically lacks the SDK; the orchestrator asks for it.
agent = [
    "anthropic>=1.0",
    # The local tier (§11.7) speaks an OpenAI-compatible protocol over plain
    # HTTP. Here rather than in the core dependencies for the reason
    # `meridian-worker` already gives: an HTTP client has no business in the
    # dependency closure that exists for database access.
    "httpx>=0.28",
]

[tool.hatch.build.targets.wheel]
packages = ["meridian_core"]
