# Serving the built app, and proxying its API calls (task B-05).
#
# The app issues only relative `/api/...` requests and holds no base URL
# anywhere in its source (`P2-11`, web/src/lib/api.ts) — deliberately, because a
# base URL is a value that has to be correct per environment and the way that
# fails is a build shipped pointing at somebody's laptop. The cost of that
# choice is that *something* has to route `/api` in every environment: Vite's
# dev server does it from `vite.config.ts`, and here it is this file.

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Unprivileged nginx cannot bind 80 and writes its temp files under /tmp;
    # the alpine image is already set up for this, and naming the port here
    # keeps the container runnable as a non-root user.
    access_log /dev/stdout;
    error_log /dev/stderr warn;

    # `api` is the compose service name, resolved by Docker's embedded DNS.
    # A trailing slash on neither side: the API's routes already begin `/api`,
    # and adding one here would forward `/api/api/...`.
    location /api {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # An export of a large corpus, or an MCP call that runs a real query,
        # takes longer than nginx's 60s default — and a proxy timeout surfaces
        # as a 504 that looks like the API crashed.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # The router is client-side and its URLs are real (`P6-20`,
    # web/src/lib/route.ts): `/sources/42` and `/nodes/7` are meant to be
    # linkable, bookmarkable and pasteable into a citation. Without this, a
    # reload on one of those paths 404s against the static root — the classic
    # SPA deployment bug, and one that only appears on refresh rather than on
    # navigation, so it survives a click-through test.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed filenames, so these can be cached hard. `index.html` must not be,
    # or a browser keeps serving a page that references assets a deploy has
    # already replaced.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
