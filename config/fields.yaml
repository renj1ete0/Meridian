# Fields of work, for naming Map areas (task B-74).
#
# An area is named by the field nearest its centroid, never by free keywords:
# keywords drawn from text let licence strings and publisher badges through
# ("bync", "free article"). Deeper areas take a subfield; a region is named from its areas.
# Edit to taste; a change applies on the next `worker.areas` build or
# `worker.areas --name-only`.
#
# "Public Records" is not OpenAlex's (`B-157`): a research classification has no name for the
# kinds of document a mostly public-sector corpus is made of, so statutes, appropriations,
# forms and site furniture were named after whichever research subfield was least far away
# ("Speech and Hearing" for a cluster of legislation). See docs/features/map.md#naming-floor.
source: OpenAlex fields and subfields (ASJC-based), fetched 2026-09-25 from api.openalex.org/subfields;
  "General …" and miscellaneous subfields left out as names that say nothing; plus Public Records
