    task_type: url
    topic: on-demand-bus
    source_tier: informal
    note: >
      Enthusiast, frequently more current than official channels and sometimes
      the only record of a route or scheme change. Tier is visible on every
      claim it supports; §7.4 will counter-seed if a node rests only on it.

  # --- AV: standards and regulation ----------------------------------------
  - url: https://www.sae.org
    task_type: url
