# Cold-start sources (spec §15 phase 0).
#
# The first crawl starts here; frontier expansion grows outward by following
# citations, links and sitemaps. Seed quality propagates through everything
# downstream (§16), which is why this list is hand-curated rather than generated.
#
# Deliberately short. Search plus tier-upranking does the discovery: SearXNG
# results are prioritised by source tier (config/source_tiers.yaml), so a .gov
# result enters the queue above a blog without anyone curating it. What a seed
# list still buys is an authority spine — a handful of roots whose *navigation*
# reaches material that ranks for no natural query, and whose reference lists
# open a dense citation neighbourhood immediately.
#
# Seeds are site roots and search queries, not deep links. §6.4 prefers structured
# APIs over scraping and plans for sitemap-based discovery, so pointing at an
# organisation's root and letting discovery work is both more robust and less
# likely to rot than a hand-copied path.
#
# task_type: url    — fetch this page, follow what it links to
#            query  — run this against the search backend, enqueue the results
#
# source_tier drives conflict resolution (§5.2) and is assigned here rather than
# inferred. `informal` is deliberately included: enthusiast sources are often more
# current and more detailed than official channels, and are sometimes the only
# record of a scheme. They are cited with their tier visible, not excluded.

# Seeds the allowlist that gates MODEL-PROPOSED targets only (§11.8). Frontier
# expansion — following links and citations out of pages already fetched — is
# mechanical, involves no model, and is governed by the blocklist in fetch_policy
# instead. Gating it here would stop citation-following at the first hop.
#
# The list grows without you: a domain frontier expansion reaches, fetches
# successfully and gets novel content from is auto-approved, because its trust
# came from discovery rather than from a model's suggestion. A domain a *model*
# proposes queues for approval, the same way model-proposed gazetteer terms do.
domain_allowlist:
  - "*.gov.sg"
  - "*.gov"
  - "*.gov.uk"
  - "*.gov.hk"
  - "*.edu"
  - "*.ac.uk"
  - "*.org"
  - arxiv.org
  - openalex.org
  - doi.org
  - core.ac.uk
  - crossref.org
  - semanticscholar.org
  - trid.trb.org
  - landtransportguru.net
  - mtr.com.hk
  - humantransit.org

sources:
