# Minimal SearXNG settings for Meridian's self-hosted metasearch backend
# (spec §6.4). Mounted read-only into the searxng container. Extend the
# engine list as engines break or get rate-limited — treat that as routine,
# per the spec, not a reason to remove the fallback API path.

use_default_settings: true

general:
  instance_name: "meridian-searxng"

search:
  formats:
    - html
    - json

server:
  secret_key: "changeme-generate-a-real-secret-before-first-boot"
  limiter: false        # internal network only; no public rate-limit needed

engines:
  - name: google scholar
    disabled: false
  # Web results off (`B-51`): measured on the live instance, 2 of 44 results
  # mentioned any word of the query — pages about unrelated software, whatever
  # was asked — while the other engines were at 98–100%. Every one of those
  # became a queued "search" result. `bing news` is a separate engine and
  # returned relevant reporting, so news keeps it.
  - name: bing
    disabled: true
  - name: duckduckgo
    disabled: false
  # More web engines (2026-09-29): off by default in SearXNG. From this machine
  # the defaults refused (brave, startpage: suspended; qwant, baidu: CAPTCHA)
  # while these answered, and on three test queries 98–100% of their results
  # mentioned a query word — the `B-51` test that took bing web out at 67%.
  # Spreading queries over more engines is the self-hosted answer to being
  # rate-limited: each sees fewer requests. Queries do reach these providers.
  - name: yep
    disabled: false
  - name: yandex
    disabled: false
  - name: naver
    disabled: false
  - name: mwmbl
    disabled: false
  - name: arxiv
    disabled: false
