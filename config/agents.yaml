# Agent registry defaults, seeded into the `agents` table at first boot
# (spec §11.3). quality_tier is ordinal (1=local small ... 4=hosted frontier)
# and distinct from cost_tier (spec §11.12).
#
# `api_key_env_var` is the NAME of the variable holding the key, never the key
# (§11.11): the database is snapshotted off-device, and a credential stored
# here would travel with every snapshot.
#
# Rows ship disabled. Set `enabled: true` once the key is in the environment —
# and note that `local-llamacpp` still needs its model string filled in,
# because which model a local server exposes is nobody else's business.

agents:
  - agent_id: hosted-frontier
    provider: anthropic
    model: claude-opus-5
    api_key_env_var: ANTHROPIC_API_KEY
    task_types: [relation_extraction, gap_analysis, analogical_expansion, drafting]
    token_scope: read_write
    cost_tier: high
    quality_tier: 4
    max_context: 200000
    enabled: false
    fallback_agent_id: null
    endpoint: null
    health_url: null
    availability: on_demand
    wake_mac: null

  - agent_id: hosted-mid
    provider: anthropic
    model: claude-sonnet-5
    api_key_env_var: ANTHROPIC_API_KEY
    task_types: [tag_attributes]
    token_scope: read_write
    cost_tier: medium
    quality_tier: 3
    max_context: 200000
    enabled: false
    fallback_agent_id: hosted-frontier
    endpoint: null
    health_url: null
    availability: on_demand
    wake_mac: null

  # An operator-attended model: prompts are written to MERIDIAN_RELAY_DIR and
  # the run defers until an answer file appears beside each one (`P4-18`). The
  # model string is what provenance records, so it names whoever answers.
  # Disabled until somebody is going to answer; enabling it with nobody
  # watching the directory just defers every run.
  - agent_id: claude-code-session
    provider: relay
    model: claude-opus-5-5
    api_key_env_var: null
    task_types: [relation_extraction, tag_attributes]
    token_scope: read_write
    cost_tier: free
    quality_tier: 4
    max_context: 200000
    enabled: false
    fallback_agent_id: null
    endpoint: null
    health_url: null
    availability: on_demand
    wake_mac: null

  - agent_id: local-llamacpp
    provider: openai_compatible
    model: "<fill in — dedicated Meridian process, not the interactive one>"
    task_types: [tag_attributes, translation, triage, extraction_fallback]
    token_scope: read_write
    cost_tier: free
    quality_tier: 2
    max_context: null
    enabled: false
    fallback_agent_id: hosted-mid
    endpoint: "${LOCAL_LLM_URL}"
    health_url: "${LOCAL_LLM_HEALTH_URL}"
    availability: opportunistic
    wake_mac: "${LOCAL_LLM_MAC}"

  # The "Ask the graph" panel (`P6-06`). A local OpenAI-compatible server —
  # llama.cpp, Ollama, vLLM — named entirely by the environment, so choosing a
  # model is an .env edit (or Admin → Agents), not a migration:
  #   LOCAL_CHAT_LLM_URL=http://<host>:8080/v1     LOCAL_CHAT_MODEL=<model name>
  # Read-only: it answers from retrieved passages and writes nothing to the graph.
  - agent_id: local-chat
    provider: openai_compatible
    model: "${LOCAL_CHAT_MODEL}"
    api_key_env_var: null
    task_types: [chat]
    token_scope: read
    cost_tier: free
    quality_tier: 2
    max_context: null
    enabled: false
    fallback_agent_id: null
    endpoint: "${LOCAL_CHAT_LLM_URL}"
    health_url: null
    availability: opportunistic
    wake_mac: null
