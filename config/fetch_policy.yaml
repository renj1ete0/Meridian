# Global fetch policy defaults. Seeded into the `fetch_policy` table ('*' row)
# at first boot, then editable per-domain in Admin. See spec §6.4.
# Resolution order: per-domain row -> this global row -> these file defaults.

respect_robots:        true
user_agent:            "MeridianBot/0.1 (+https://<contact-url>)"
send_contact_header:   true

concurrency_per_domain: 2

# Minimum wait between requests to one domain, plus a random extra drawn from
# [0, delay_jitter_ms] on every request. A fixed interval is both a recognisable
# fingerprint and a way to synchronise bursts across domains; jitter costs
# nothing and avoids each.
delay_per_domain_ms:    1000
delay_jitter_ms:        1500
respect_crawl_delay:    true

conditional_requests:   true      # If-Modified-Since / ETag
timeout_s:              30
max_retries:            2
backoff_base_s:         5

# --- SSRF and content safeguards ---------------------------------------------
# Crawl targets come from untrusted pages, so a link to a private address is
# something frontier expansion would otherwise follow without hesitating.
# Enforced after DNS resolution, not by inspecting the string: a public hostname
# can resolve to, or redirect to, an internal one.
allowed_schemes:        [http, https]     # never file:, ftp:, gopher:, data:

# An http:// link may be *followed* — most sites redirect — but content still
# served in plaintext at the end of the chain is rejected. On plain HTTP anyone
# on the path can rewrite the page, and for a crawler feeding a model that holds
# write tools that is an injection vector needing no compromise of the origin.
# Override per domain in Admin for the handful of legitimate http-only sources
# worth the risk; the per-domain mechanism (§6.4) already exists for exactly this.
require_https_final:     true
block_private_addresses: true             # 10/8, 172.16/12, 192.168/16, 127/8,
                                          # ::1, fc00::/7, and link-local
block_cloud_metadata:    true             # 169.254.169.254 and friends
max_redirects:           5
revalidate_each_redirect: true            # a 200 can 302 into the LAN
block_mixed_dns:         true             # reject if ANY resolved A/AAAA is private
                                          # (DNS rebinding)

allowed_content_types:
  - text/html
  - text/plain
  - application/pdf
  - application/xhtml+xml
  - application/xml
  - application/json
  - application/msword
  - application/vnd.openxmlformats-officedocument.wordprocessingml.document
  - application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
  - application/vnd.openxmlformats-officedocument.presentationml.presentation

max_decompression_ratio: 100              # zip/gzip bomb guard

blocked_after_failures: 5         # consecutive; then mark domain blocked
prefetch_filter:        true      # domain blocklist + already-seen check
render_js:              auto      # auto | always | never
max_page_bytes:         20000000
