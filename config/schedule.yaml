# The timetable (task P5-06, spec §13.1).
#
# Seeded at first boot only. The database is authoritative afterwards — §13.1 is
# explicit that schedule changes are a UI action, not a file edit, and a
# scheduler that re-read this file would quietly undo every change made through
# the interface.
#
# Intervals in seconds rather than cron expressions. "Every 6 hours" is a number
# a UI can offer as a field; `0 */6 * * *` is a support question, and parsing it
# is a dependency.
#
# `module` is run as `python -m <module>` with `args` as a list, never through a
# shell. A timetable row is editable from the UI, and a row that could name a
# shell command would make this table a remote execution surface.

jobs:
  - name: digest
    module: worker.digest
    interval_seconds: 86400        # daily — §12.5's health line, and §13.3's alerts
    enabled: true

  - name: embed
    module: worker.embed
    args: ["--once"]
    # **Disabled: the `embed` service owns this now (`B-25`).**
    #
    # The fetch loop never embeds (§6.1 draws one pipeline and it is three
    # passes), so chunks are unsearchable by meaning until something runs this.
    # Hourly was the wrong shape for it: the scheduler kills a subprocess at
    # 1800 seconds, so a pass over a real backlog was cut off at exactly 30
    # minutes and had to wait an hour for a window it would lose the same way.
    # A backlog bigger than one window could never clear.
    #
    # `worker.embed` without `--once` is a poll loop, and the handover has
    # always described it as one of four long-running processes, so it runs as
    # a service and this row stays here disabled rather than deleted: it
    # documents the cadence somebody would otherwise re-invent, and turning it
    # back on is how you would run the pass on a deployment with no service.
    interval_seconds: 3600
    enabled: false

  - name: novelty
    module: worker.novelty
    args: ["--once"]
    # The gate needs vectors, so this trails whatever produced them. With
    # `embed` running continuously (`B-25`) the lag is at most this interval
    # rather than the interval plus a queue, and it stays the window §6.1
    # accepts — a chunk that exists, is not yet searchable, and is not yet
    # known to be a duplicate.
    interval_seconds: 3600
    enabled: true

  - name: areas
    module: worker.areas
    args: ["--once"]
    # `P6-30`: the corpus as nested clusters of passages, for the map.
    # Derived and rebuilt wholesale; daily, because an area moves only when a
    # meaningful share of the corpus does.
    interval_seconds: 86400
    enabled: true

  - name: boilerplate
    module: worker.boilerplate
    args: ["--once"]
    # `B-43`: which lines each host repeats on enough of its pages to be
    # template, from `page_lines` (written at fetch, from uncleaned text).
    # Derived and rebuilt wholesale, so a missed run only means the fetch path
    # cleans against yesterday's set. Daily is enough: a site's template does
    # not change hourly, and the first pages of a new host are chunked before
    # it has five pages to count anyway.
    interval_seconds: 86400
    enabled: true

  - name: topics
    module: worker.retopic
    args: ["--apply"]
    # `P2-21`: which topics each source's *content* is about, from its chunk
    # vectors. Trails `embed` like `novelty` does — a source is only labelled
    # once every live chunk has a vector — and re-examines what a topic change
    # or a re-crawl made stale. Then, under the same basis, each passage's own
    # labels (`P2-24`), so a chapter inside a document about something else is
    # findable by its topic. Writes labels only. NEVER `--demote-offtopic`:
    # that hands sources to the retention sweep, and is a person's decision
    # after reading the report, not a timer's.
    interval_seconds: 3600
    enabled: true

  - name: places
    module: worker.places
    args: ["--apply"]
    # `P2-23`: which places each source's content is about — country and city
    # names, jurisdictional gazetteer terms, cited place entities, the
    # publisher's domain. Reads words, not vectors, so it does not wait for
    # `embed`. Re-examines what a re-crawl, a new place edge or a gazetteer
    # change made stale; a pass with nothing stale is one query.
    interval_seconds: 3600
    enabled: true

  - name: sweep
    module: worker.sweep
    # NO `--apply`. Reports what could be reclaimed and deletes nothing: this is
    # the only pass that destroys something a re-crawl cannot reproduce, and it
    # should not do that on a timer without anybody reading the report first.
    interval_seconds: 86400
    enabled: true

  - name: harvest
    module: worker.harvest
    # Daily. §5.6's acronym auto-harvest over documents nothing has read yet —
    # one regex per document, and the queue is a partial index, so a run with
    # nothing new to read costs an index scan that returns no rows.
    interval_seconds: 86400
    enabled: true

  - name: hostscore
    module: worker.hostscore
    args: ["--once"]
    # `B-48`: per-host on-topic share from the content labels `topics` writes,
    # plus each host's pending links. The fetch loop re-reads it on every
    # housekeeping tick and stops queueing links into hosts whose pages are
    # almost never about a topic. Hourly, like `topics`, which it trails.
    interval_seconds: 3600
    enabled: true

  - name: seedsearch
    module: worker.seedsearch
    args: ["--once"]
    # `B-51`, §7.4: fresh queries per active topic from its name, description
    # and approved vocabulary — concepts, evidence and counter-evidence
    # phrasings, pairs of concepts, and news. Without it the crawl ran five
    # seed queries and then only followed links, which converges on the same
    # few sites. At most 6 per topic per run, and none for a topic with 24
    # unanswered already. Since `P5-05` the same run also reads the graph:
    # up to 6 tier counter-seeds and 2 distant walks (§7.4 mechanisms 2, 4).
    interval_seconds: 21600
    enabled: true

  - name: translate
    module: worker.translate
    args: ["--once"]
    # `B-52`, §7.4 mechanism 5: other-language names for the search
    # vocabulary, from Wikipedia's interlanguage links, so `seedsearch` can
    # write non-English queries in that language's own words. One request a
    # second, bounded per run, and each phrase re-asked only after 90 days.
    interval_seconds: 86400
    enabled: true

  - name: docdupes
    module: worker.docdupes
    args: ["--apply"]
    # `B-44`/`B-54`: marks sources that copy an earlier one, and clears marks
    # that no longer hold. Wholesale and non-destructive, so a daily run is
    # safe — but a mark hides a source from search, so this ships disabled:
    # read the first `python -m worker.docdupes` report, then enable it.
    interval_seconds: 86400
    enabled: false

  - name: steerproposals
    module: worker.steerproposals
    args: ["--once"]
    # `P6-38`, §10.2: proposes a bounded steering change for a topic that is
    # starved or over-served against its weight (a day's new on-topic sources
    # and fetches), and applies each proposal nobody rejected once its window
    # (`steering_proposal_window_hours`, 12 by default) has passed. Hourly, so a
    # proposal applies within the hour its window ends.
    interval_seconds: 3600
    enabled: true
