# Hand-seeded gazetteer, loaded into spaCy's EntityRuler at worker startup so
# gazetteer matches take precedence over statistical NER (spec §5.6).
#
# A pretrained model will resolve "Land Transport Authority" as an ORG if you are
# lucky, and will make nothing at all of "Electronic Road Pricing", "Silver Zone",
# "ODD" or "farebox recovery ratio". This list is what makes fast-loop entity
# extraction useful on day one, before any auto-harvesting has run.
#
# It is also entity resolution's alias source (§5.5) — the alias lists here are
# exactly the matching that stops "LTA", "Land Transport Authority" and "the
# Authority" becoming three nodes. The two tables share one definition rather
# than duplicating.
#
# This is the seed, not the target. Three mechanisms grow it: auto-harvesting the
# "Full Name (ACRONYM)" pattern out of already-extracted text, which is extremely
# high-yield in government and academic documents; model-proposed terms arriving
# as approved:false; and manual additions. Everything here is approved:true
# because a human wrote it.

