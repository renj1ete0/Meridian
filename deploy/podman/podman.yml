# Meridian on podman, rootful, driven by docker-compose (`B-226`, ADR 0021).
#
# The compose files are the same as on Docker; this overlay holds only what podman
# needs differently. Name it last in COMPOSE_FILE (docs/guides/deploy-podman.md):
#
#   COMPOSE_FILE=docker-compose.yml:deploy/split/remote-embedder.yml:deploy/podman/podman.yml
#
# What changes here, and only this:
#   - Watchtower is parked: it drives Docker's API to recreate containers, and on
#     podman meridian-update.timer pulls and recreates through compose instead.
#     `migrate` stays in the `autoupdate` profile, so an update still migrates first.

services:
  watchtower:
    # `!override`: compose merges a profiles list by default, which kept `autoupdate`
    # and so still started Watchtower; seen on podman 5.8 with compose 5.6.
    profiles: !override [docker-only]
