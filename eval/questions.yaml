  - id: Q32
    kind: comparison
    question: What are the regulations governing autonomous vehicle deployment around the world, and what
      are the key approaches used and the differences between them?
    topics:
    - autonomous-vehicle
    what_a_good_answer_contains:
      sources: government-tier sources (statutes, regulations, regulators' guidance) from several jurisdictions;
        research or institutional comparisons of regimes
      concepts:
      - at least three jurisdictions' regimes
      - the approach each takes (permit-based trials, type approval, national framework versus local permits,
        liability rules)
      - who regulates in each
      - how the regimes differ
      must_show: the date of each rule, and which regimes are trials versus full deployment
      wrong_if:
      - one jurisdiction's rules are presented as general
      - press summaries are the only sources
      - a superseded rule is shown as current without a date
    grading:
      rubric: comparison
    notes: Operator's question (their second phrasing, replacing a shorter one). Tests breadth across jurisdictions
      and dated, government-tier sourcing.
    reference_answer: null
    drafted_by: operator
    reviewed: true
