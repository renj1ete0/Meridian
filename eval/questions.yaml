  - id: Q31
    kind: evidence
    question: How do we assess walkability in tropical Singapore?
    topics:
    - walkability
    - biology
    what_a_good_answer_contains:
      sources: research on walkability indices and audit tools, government design guidance, studies of walking
        in hot-humid climates
      concepts:
      - walkability index or audit method
      - what the measure includes (connectivity, destinations, footpath quality, shelter, crossings)
      - climate-specific factors (shade, shelter, heat exposure)
      - whether the method has been validated in a tropical city
      must_show: which measures come from temperate cities and which were built or adapted for a tropical
        one
      wrong_if:
      - a temperate-city index is presented as fitting Singapore without saying what it leaves out
      - heat and shelter are absent from the answer
    grading:
      rubric: evidence
    notes: Operator's question. Tests whether a method question finds methods, and whether the climate qualification
      surfaces on its own.
