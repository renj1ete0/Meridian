[project]
name = "meridian-worker"
version = "0.97.0"
description = "Meridian fast loop — fetch, extract, embed. Never calls an LLM (spec §2.1, §6.1)."
requires-python = ">=3.12"
license = "MIT"
license-files = ["../../LICENSE"]
dependencies = [
    "meridian-core",
    # The static fetch path. httpx is here rather than in meridian_core because
    # the core package is what the API and orchestrator import for database
    # access — an HTTP client has no business in that dependency closure.
    "httpx>=0.28",
    "trafilatura>=2.2.0",
    # Sitemap parsing (P1-28). trafilatura already pulls lxml in, and P1-30
    # learned what an undeclared transitive dependency costs: a container built
    # with `uv sync --package meridian-worker` gets only what is declared, and
    # meridian_core's undeclared pyyaml died on ModuleNotFoundError at import.
    "lxml>=5.0",
    "markitdown[docx,outlook,pptx,xlsx]>=0.1.7",
    "onnxruntime>=1.29",
]

[project.optional-dependencies]
embed = [
    "sentence-transformers>=3.0",
    # `P2-17`'s sidecar serves the same model over HTTP, from this image rather
    # than a second one — a separate service would mean a second 2.3GB download
    # and a second resident copy on a machine that has one of each.
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
]

# spaCy and a model, for `P5-02`'s EntityRuler and `P5-01`'s NER. An extra
# rather than a dependency: the fast loop does not run NER yet, and thinc, blis
# and a model file in the image that fetches web pages is disk and build time
# the Pi spends on something nothing calls. The patterns themselves are built in
# meridian_core, which needs none of it.
ner = [
    "spacy>=3.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["worker"]
