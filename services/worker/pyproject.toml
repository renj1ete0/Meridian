[project]
name = "meridian-worker"
version = "0.25.0"
description = "Meridian fast loop — fetch, extract, embed. Never calls an LLM (spec §2.1, §6.1)."
requires-python = ">=3.12"
dependencies = [
    "meridian-core",
    # The static fetch path. httpx is here rather than in meridian_core because
    # the core package is what the API and orchestrator import for database
    # access — an HTTP client has no business in that dependency closure.
    "httpx>=0.28",
    "trafilatura>=2.2.0",
    # Sitemap parsing (P1-28). trafilatura already pulls lxml in, and P1-30
    # learned what an undeclared transitive dependency costs: a container built
    # with `uv sync --package meridian-worker` gets only what is declared, and
    # meridian_core's undeclared pyyaml died on ModuleNotFoundError at import.
    "lxml>=5.0",
    "markitdown[docx,outlook,pptx,xlsx]>=0.1.7",
    "onnxruntime>=1.29",
]

[project.optional-dependencies]
embed = [
    "sentence-transformers>=3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["worker"]
