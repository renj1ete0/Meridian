# Meridian — local dev infra only. See docs/spec/meridian-project-scaffold.md §6.
#
# Host ports live in a distinctive 211xx block so nothing here collides with a
# stray Postgres on 5432 or whatever else is already bound to 8080. Container
# ports stay standard, so service-to-service URLs inside the compose network are
# unchanged (postgres:5432, searxng:8080).
#
#   21111 postgres · 21112 searxng · 21113 crawl4ai
#   21114 api (native) · 21115 web (native)
#
# Runs the stateful dependencies (postgres, searxng, crawl4ai) in containers,
# exposed on localhost. Application services (api/worker/orchestrator/web) run
# natively via `uv` / `npm` against this infra — see README.md and scaffold §6
# for the startup sequence. No cloudflared, no application containers here.

name: meridian-dev

services:
  postgres:
    image: pgvector/pgvector:pg17
    ports: ["21111:5432"]             # host 21111 -> container 5432
    environment:
      POSTGRES_DB: meridian
      POSTGRES_USER: meridian
      POSTGRES_PASSWORD: dev
      PG_RW_PASSWORD: dev
      PG_RO_PASSWORD: dev
    volumes:
      # Named volume, not a bind mount: Postgres writes as root, and a
      # root-owned pgdata inside the working tree can't be cleaned up without a
      # container. `docker compose down -v` removes this properly.
      - meridian_pgdata:/var/lib/postgresql/data
      - ./scripts/init-roles.sh:/docker-entrypoint-initdb.d/10-roles.sh:ro

  searxng:
    image: searxng/searxng:latest
    ports: ["21112:8080"]
    volumes: ["./config/searxng:/etc/searxng:ro"]

  crawl4ai:
    image: unclecode/crawl4ai:0.9.2
    ports: ["21113:11235"]
    shm_size: 1g
    environment:
      # Not optional, despite the name. Since 0.9.0 the entrypoint binds
      # gunicorn to 127.0.0.1 *inside the container* unless a credential is
      # configured, so without this the published port above reaches nothing.
      # Every request then needs `Authorization: Bearer $CRAWL4AI_TOKEN`.
      CRAWL4AI_API_TOKEN: ${CRAWL4AI_TOKEN:-dev}
      CRAWL4AI_HOOKS_ENABLED: "false"

volumes:
  meridian_pgdata:
