[project]
name = "meridian"
version = "0.163.4"
description = "Self-hosted autonomous research system"
requires-python = ">=3.12"
readme = "README.md"
license = { file = "LICENSE" }
dependencies = [
    # `[agent]` here and not in the service packages: the development
    # environment runs the whole suite, including the orchestrator's model
    # client, while each image installs only its own package (`P4-15`).
    "meridian-core[agent]",
    "meridian-worker",
    "meridian-api",
    "pyyaml>=6.0",
]

# Monorepo root. The root project exists so `uv run` works from here (alembic,
# pytest, scripts). Add each service to `members` as it gains a pyproject.toml —
# a bare glob over services/* fails for directories that don't have one yet.
[tool.uv.workspace]
members = ["packages/*", "services/worker", "services/api"]

[tool.uv.sources]
meridian-core = { workspace = true }
meridian-worker = { workspace = true }
meridian-api = { workspace = true }

[dependency-groups]
dev = [
    "alembic>=1.14",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# PEP 8 (E, W, N), PEP 257 docstring layout (D2xx-D4xx), plus the bug and
# modernisation rules. Conventions and the exceptions below: AGENTS.md "Code and
# comment standards".
select = ["E", "W", "F", "I", "UP", "B", "SIM", "N", "D2", "D3", "D4"]
ignore = [
    "D401",  # Summaries may be noun phrases ("Whether ...", "The ...") as well as commands.
    "D400",  # D415 instead: a summary may end in "?" as well as ".".
    "N818",  # Exceptions are named for what happened (NotConfigured), not suffixed "Error".
]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.per-file-ignores]
# Test docstrings describe a scenario and its reason, often in two sentences.
"tests/**" = ["D"]
# Alembic writes the revision docstring in its own layout.
"migrations/**" = ["D"]

# The workspace packages. Without this ruff sorts them with third-party
# imports, which disagrees with how every module in the repo is written and
# left `ruff check .` failing on files nobody had touched.
[tool.ruff.lint.isort]
known-first-party = ["meridian_core", "worker", "api", "orchestrator"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# tests/http_doubles.py holds the HTTP test doubles the fetcher tests import
# directly; importlib mode does not put a test file's own directory on the path.
pythonpath = ["tests"]
# pytest's logging plugin attaches its own handlers to the root logger, which
# interleaves plain-text records with the JSON ones the logging tests parse.
# importlib mode: without it, two test files sharing a basename across
# tests/unit and tests/integration collide at collection because there are no
# __init__.py files to disambiguate them.
addopts = "-p no:logging --import-mode=importlib"
markers = [
    "server_timer: relies on Postgres's own timers (statement_timeout), which the clock check cannot move",
]
